<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOGOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Avaliador de Jogos</h1>
        
    </header>
    <main>
        <nav>
            <ul>
                <li>
                    <a href="jogos.html">inicio</a>
                </li>
                <li>
                    <a href="biblioteca.html">biblioteca</a>
                </li>
            </ul>
        <p><h3>Avalie seus jogos favoritos</h3></p>
        <p id="mensagem"></p>
        <form action="" id="formJogo">
            </div>
            <div class="campo">
                <label for="nome"></label>
                <input 
                type="text"
                id="nome"
                name="nome"
                placeholder="Ex: RE:4"
                >
            </div>
            <div class="caampo">
                <label for="nota"></label>
                <input 
                type="number"
                id="nota"
                name="nota"
                placeholder="0-10"
                max="10"
                min="0"
                >
            </div>
            <div class="campo">
                <label for="feedback"></label>
                <select name="feedback" id="feedback">
                    <option value="">feedback</option>
                    <option value="sem palavras">Sem palavras</option>
                    <option value="icrivel">Incrivel</option>
                    <option value="gostei muito">Gostei muito</option>
                    <option value="gostei um pouco">Gostei pouco</option>
                    <option value="meh">Meh</option>
                    <option value="jogavel">Jogavel</option>
                    <option value="ruim">Ruim</option>
                    <option value="pessimo">Pessimo</option>
                    <option value="que porra e essa">Que porra é essa</option>
                    <option value="bota fogo">Bota fogo</option>
                </select>
            </div>
            <div class="campo">
                <label for="experiencia"></label>
                <input 
                type="text"
                id="experiencia"
                name="experiencia"
                placeholder="decreva sua experiencia"
                >
            </div>
            <div class="campo">
                <label for="categoria"></label>
                <select name="categoria" id="categoria">
                    <option value="">Estilos</option>
                    <option value="ação">Ação</option>
                    <option value="terror">Terror</option>
                    <option value="aventura">Aventura</option>
                    <option value="RPG">RPG</option>
                    <option value="ficção">Ficção</option>
                    <option value="sobrevivencia">Sobrevivencia</option>
                </select>
            </div>
            <div class="campo">
                <label for="categoria2"></label>
                <select name="categoria2" id="categoria2">
                    <option value="">Estilos</option>
                    <option value="">Ação</option>
                    <option value="">Terror</option>
                    <option value="">Aventura</option>
                    <option value="">RPG</option>
                    <option value="">Ficção</option>
                    <option value="">Sobrevivencia</option>
                </select>
            </div>
            <button type="submit" class="botaoSalvar">Save</button>
        </form>
        </nav>
    </main>
    <footer>
        <p>Sua lista de jogos</p>
    </footer>
    <script src="cadastro.js"></script>
</body>
</html>
